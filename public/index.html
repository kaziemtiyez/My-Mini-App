<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Mini Dollar Earn</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div id="app">

    <header class="topbar">
      <div>
        <div class="brand">💰 Mini Dollar</div>
        <div id="welcome">Welcome</div>
      </div>

      <div class="avatar" id="avatar">U</div>
    </header>

    <main>

      <section class="balance-card">
        <span>Available Balance</span>

        <strong id="balance">
          $0.00
        </strong>

        <small>USD</small>
      </section>

      <section class="stats">

        <div class="stat-card">
          <span>👥 Referrals</span>
          <strong id="referrals">0</strong>
        </div>

        <div class="stat-card">
          <span>🎯 Ads Today</span>
          <strong id="adsToday">0</strong>
        </div>

      </section>

      <section class="earn-card">

        <h2>Earn Money</h2>

        <button
          class="earn-button"
          id="adsgramButton"
        >
          🟡 Watch AdsGram
          <span>15 Ads</span>
        </button>

        <button
          class="earn-button"
          id="monetagButton"
        >
          🟡 Watch Monetag
          <span>10 Ads</span>
        </button>

      </section>

      <section class="content-card">

        <h2>Quick Menu</h2>

        <div class="menu-grid">

          <button data-page="referral">
            👥 Referral
          </button>

          <button data-page="leaderboard">
            🏆 Leaderboard
          </button>

          <button data-page="withdraw">
            💳 Withdraw
          </button>

          <button data-page="history">
            📊 History
          </button>

        </div>

      </section>

      <section
        id="pageContent"
        class="content-card"
      >
        <h2>Dashboard</h2>
        <p>Watch ads and earn rewards.</p>
      </section>

    </main>

    <nav class="bottom-nav">

      <button data-page="home">
        🏠
        <span>Home</span>
      </button>

      <button data-page="earn">
        💰
        <span>Earn</span>
      </button>

      <button data-page="referral">
        👥
        <span>Refer</span>
      </button>

      <button data-page="profile">
        👤
        <span>Profile</span>
      </button>

    </nav>

  </div>

  <script src="/app.js"></script>

</body>
</html>
